name: Bug report
description: Something in Ripen does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security issues go to a private advisory instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with …
        2. Run `ripen promote …`
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [Server, JavaScript SDK, Dart SDK, Web components, Release console, CLI or GitHub Action, OpenFeature provider, Docker image, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or the CLI's --json output. Remove tokens and keys first.
      render: text
